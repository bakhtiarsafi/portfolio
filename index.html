/* ========================================
   style.css — All styles go here
   ======================================== */
:root{
  --bg-primary:#f0f4ff;--bg-secondary:#ffffff;--bg-card:#ffffff;
  --text-primary:#0f172a;--text-secondary:#475569;--text-muted:#94a3b8;
  --accent:#2563eb;--accent2:#7c3aed;
  --grad:linear-gradient(135deg,#2563eb,#7c3aed);
  --border:#e2e8f0;--shadow:0 4px 20px rgba(37,99,235,.08);
  --shadow-lg:0 12px 40px rgba(37,99,235,.16);
  --nav-bg:rgba(240,244,255,.92);
  --skill-bg:#eff6ff;--skill-text:#2563eb;--card-hover:#f0f7ff;
  --timeline:#e2e8f0;
}
[data-theme=dark]{
  --bg-primary:#0c0c1a;--bg-secondary:#13132a;--bg-card:#1a1a35;
  --text-primary:#e2e8f0;--text-secondary:#94a3b8;--text-muted:#64748b;
  --accent:#60a5fa;--accent2:#a78bfa;
  --grad:linear-gradient(135deg,#60a5fa,#a78bfa);
  --border:#252545;--shadow:0 4px 20px rgba(0,0,0,.4);
  --shadow-lg:0 12px 40px rgba(0,0,0,.5);
  --nav-bg:rgba(12,12,26,.92);
  --skill-bg:#1e2a45;--skill-text:#60a5fa;--card-hover:#20204a;
  --timeline:#252545;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;background:var(--bg-primary);color:var(--text-primary);transition:background .3s,color .3s;line-height:1.6}

/* ── NAV ── */
nav{position:fixed;top:0;left:0;right:0;z-index:1000;background:var(--nav-bg);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 2rem;transition:all .3s}
.nav-logo{font-size:1.35rem;font-weight:800;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-decoration:none}
.nav-links{display:flex;align-items:center;gap:1.4rem;list-style:none}
.nav-links a{text-decoration:none;color:var(--text-secondary);font-size:.875rem;font-weight:500;transition:color .2s}
.nav-links a:hover{color:var(--accent)}
.nav-right{display:flex;align-items:center;gap:.8rem}
.theme-btn{background:var(--bg-card);border:1px solid var(--border);color:var(--text-primary);width:38px;height:38px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.95rem;transition:all .3s}
.theme-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;background:none;border:none;padding:4px}
.hamburger span{display:block;width:24px;height:2px;background:var(--text-primary);border-radius:2px;transition:all .3s}

/* ── HERO ── */
.hero{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:80px 2rem 3rem;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;width:700px;height:700px;border-radius:50%;background:radial-gradient(circle,rgba(37,99,235,.07) 0%,transparent 70%);top:-150px;right:-150px;pointer-events:none}
.hero::after{content:'';position:absolute;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(124,58,237,.05) 0%,transparent 70%);bottom:-100px;left:-100px;pointer-events:none}
.hero-inner{max-width:1100px;width:100%;display:grid;grid-template-columns:1fr 1fr;gap:4rem;align-items:center}
.hero-badge{display:inline-flex;align-items:center;gap:.5rem;background:var(--skill-bg);color:var(--accent);font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:2px;padding:.35rem 1rem;border-radius:50px;margin-bottom:1rem;border:1px solid rgba(37,99,235,.15)}
.hero h1{font-size:clamp(2.4rem,4.5vw,3.6rem);font-weight:800;line-height:1.15;margin-bottom:.6rem}
.hero h1 .grd{background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-title{font-size:1rem;color:var(--text-secondary);margin-bottom:1.5rem;line-height:1.7}
.hero-btns{display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:2rem}
.btn-primary{background:var(--grad);color:#fff;padding:.75rem 1.6rem;border-radius:50px;text-decoration:none;font-weight:600;font-size:.9rem;border:none;cursor:pointer;transition:transform .2s,box-shadow .2s;display:inline-flex;align-items:center;gap:.5rem}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(37,99,235,.4)}
.btn-outline{background:transparent;color:var(--accent);padding:.75rem 1.6rem;border-radius:50px;text-decoration:none;font-weight:600;font-size:.9rem;border:2px solid var(--accent);cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:.5rem}
.btn-outline:hover{background:var(--accent);color:#fff;transform:translateY(-2px)}
.hero-socials{display:flex;gap:.8rem}
.hero-socials a{width:40px;height:40px;border-radius:50%;background:var(--bg-card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text-secondary);text-decoration:none;font-size:.95rem;transition:all .3s}
.hero-socials a:hover{background:var(--grad);color:#fff;border-color:transparent;transform:translateY(-3px)}
.photo-wrap{display:flex;justify-content:center}
.photo-ring{position:relative;width:300px;height:300px}
.photo-ring::before{content:'';position:absolute;inset:-4px;border-radius:50%;background:var(--grad);z-index:0;animation:spin 10s linear infinite}
.photo-ring::after{content:'';position:absolute;inset:0;border-radius:50%;background:var(--bg-primary);z-index:1}
@keyframes spin{to{transform:rotate(360deg)}}
.photo-ring img{position:absolute;inset:8px;border-radius:50%;object-fit:cover;z-index:2;width:calc(100% - 16px);height:calc(100% - 16px)}

/* ── SECTIONS ── */
section{padding:80px 2rem}
.section-inner{max-width:1100px;margin:0 auto}
.stag{display:inline-block;background:var(--skill-bg);color:var(--accent);font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:2px;padding:.3rem .9rem;border-radius:50px;margin-bottom:.7rem;border:1px solid rgba(37,99,235,.12)}
.stitle{font-size:clamp(1.7rem,3vw,2.4rem);font-weight:800;margin-bottom:.4rem}
.ssub{color:var(--text-muted);margin-bottom:3rem;font-size:.95rem}

/* ── ABOUT ── */
#about{background:var(--bg-secondary)}
.about-grid{display:grid;grid-template-columns:1fr 2fr;gap:2.5rem;align-items:start}
.info-card{background:var(--bg-card);border:1px solid var(--border);border-radius:20px;padding:1.8rem;box-shadow:var(--shadow)}
.info-row{display:flex;align-items:center;gap:.9rem;padding:.75rem 0;border-bottom:1px solid var(--border)}
.info-row:last-child{border-bottom:none}
.info-icon{width:36px;height:36px;border-radius:10px;background:var(--skill-bg);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:.85rem;flex-shrink:0}
.info-text label{display:block;font-size:.68rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;font-weight:600}
.info-text span{font-size:.88rem;font-weight:500;color:var(--text-primary)}
.about-body p{color:var(--text-secondary);margin-bottom:1.2rem;font-size:.97rem;line-height:1.85}

/* ── TIMELINE ── */
.timeline{position:relative;padding-left:2rem}
.timeline::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--timeline)}
.tl-item{position:relative;padding:0 0 2.5rem 2rem}
.tl-item::before{content:'';position:absolute;left:-7px;top:8px;width:16px;height:16px;border-radius:50%;background:var(--grad);border:3px solid var(--bg-primary);z-index:1}
.tl-card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:1.5rem;box-shadow:var(--shadow);transition:all .3s}
.tl-card:hover{transform:translateX(6px);box-shadow:var(--shadow-lg);background:var(--card-hover)}
.tl-date{display:inline-flex;align-items:center;gap:.4rem;background:var(--skill-bg);color:var(--accent);font-size:.75rem;font-weight:700;padding:.25rem .75rem;border-radius:50px;margin-bottom:.8rem}
.tl-card h3{font-size:1.05rem;font-weight:700;margin-bottom:.3rem}
.tl-card h4{font-size:.9rem;color:var(--accent);font-weight:600;margin-bottom:.7rem;display:flex;align-items:center;gap:.4rem}
.tl-card p{font-size:.88rem;color:var(--text-secondary);line-height:1.75}

/* ── SKILLS ── */
#skills{background:var(--bg-secondary)}
.skills-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.4rem}
.skill-cat{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:1.5rem;box-shadow:var(--shadow);transition:all .3s}
.skill-cat:hover{transform:translateY(-5px);box-shadow:var(--shadow-lg)}
.skill-cat h3{font-size:.9rem;font-weight:700;color:var(--accent);margin-bottom:1rem;display:flex;align-items:center;gap:.5rem}
.skill-tags{display:flex;flex-wrap:wrap;gap:.45rem}
.skill-tag{background:var(--skill-bg);color:var(--skill-text);font-size:.78rem;font-weight:500;padding:.3rem .8rem;border-radius:50px;transition:all .2s;cursor:default}
.skill-tag:hover{background:var(--accent);color:#fff}

/* ── PROJECTS ── */
#projects{background:var(--bg-primary)}
.projects-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.5rem}
.proj-card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:1.8rem;box-shadow:var(--shadow);transition:all .3s;display:flex;flex-direction:column}
.proj-card:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg)}
.proj-icon{width:48px;height:48px;border-radius:14px;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.25rem;margin-bottom:1.2rem}
.proj-card h3{font-size:1.05rem;font-weight:700;margin-bottom:.6rem}
.proj-card p{font-size:.88rem;color:var(--text-secondary);line-height:1.75;flex:1;margin-bottom:1.2rem}
.proj-tags{display:flex;flex-wrap:wrap;gap:.4rem}
.proj-tag{background:var(--skill-bg);color:var(--skill-text);font-size:.73rem;font-weight:500;padding:.25rem .65rem;border-radius:50px}

/* ── CERTIFICATIONS ── */
#certifications{background:var(--bg-secondary)}
.cert-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1.4rem}
.cert-card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:1.4rem;box-shadow:var(--shadow);display:flex;align-items:flex-start;gap:1rem;transition:all .3s}
.cert-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.cert-icon{width:44px;height:44px;border-radius:12px;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.1rem;flex-shrink:0}
.cert-info h3{font-size:.92rem;font-weight:700;margin-bottom:.25rem}
.cert-info p{font-size:.82rem;color:var(--text-secondary)}
.cert-info span{display:inline-block;margin-top:.3rem;font-size:.75rem;color:var(--accent);font-weight:600}

/* ── CONTACT ── */
#contact{background:var(--bg-primary)}
.contact-grid{display:grid;grid-template-columns:1fr 1.6fr;gap:2.5rem;align-items:start}
.contact-links{display:flex;flex-direction:column;gap:1rem}
.c-link{display:flex;align-items:center;gap:.9rem;padding:.9rem 1rem;background:var(--bg-card);border:1px solid var(--border);border-radius:14px;text-decoration:none;color:var(--text-primary);transition:all .3s}
.c-link:hover{background:var(--card-hover);transform:translateX(5px);border-color:var(--accent)}
.c-link-icon{width:42px;height:42px;border-radius:12px;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;font-size:1rem;flex-shrink:0}
.c-link-info label{display:block;font-size:.68rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;font-weight:600}
.c-link-info span{font-size:.88rem;font-weight:500}
.contact-form{background:var(--bg-card);border:1px solid var(--border);border-radius:20px;padding:2rem;box-shadow:var(--shadow)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem}
.form-group{display:flex;flex-direction:column;gap:.35rem;margin-bottom:1rem}
.form-group label{font-size:.82rem;font-weight:600;color:var(--text-secondary)}
.form-group input,.form-group textarea{background:var(--bg-primary);border:1px solid var(--border);border-radius:10px;padding:.7rem .95rem;font-size:.9rem;color:var(--text-primary);font-family:'Inter',sans-serif;transition:border-color .2s,box-shadow .2s;outline:none;resize:vertical}
.form-group input:focus,.form-group textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.form-success{display:none;background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0;border-radius:10px;padding:.75rem 1rem;font-size:.88rem;font-weight:500;margin-top:1rem;text-align:center}
[data-theme=dark] .form-success{background:#064e3b;color:#a7f3d0;border-color:#065f46}

/* ── FOOTER ── */
footer{background:var(--bg-secondary);border-top:1px solid var(--border);padding:1.8rem 2rem;text-align:center;color:var(--text-muted);font-size:.85rem}
footer a{color:var(--accent);text-decoration:none}

/* ── SCROLL TOP ── */
.scroll-top{position:fixed;bottom:2rem;right:2rem;width:44px;height:44px;border-radius:50%;background:var(--grad);color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.95rem;opacity:0;pointer-events:none;transform:translateY(10px);transition:all .3s;z-index:999;box-shadow:0 4px 15px rgba(37,99,235,.4)}
.scroll-top.vis{opacity:1;pointer-events:all;transform:translateY(0)}

/* ── ANIMATIONS ── */
.fade{opacity:0;transform:translateY(28px);transition:opacity .65s ease,transform .65s ease}
.fade.vis{opacity:1;transform:translateY(0)}
.d1{transition-delay:.1s}.d2{transition-delay:.2s}.d3{transition-delay:.3s}

/* ── RESPONSIVE ── */
@media(max-width:900px){
  .about-grid{grid-template-columns:1fr}
  .contact-grid{grid-template-columns:1fr}
}
@media(max-width:768px){
  .hamburger{display:flex}
  .nav-links{position:fixed;top:64px;left:0;right:0;background:var(--nav-bg);backdrop-filter:blur(20px);flex-direction:column;padding:1.5rem;gap:1.2rem;border-bottom:1px solid var(--border);transform:translateY(-110%);opacity:0;pointer-events:none;transition:all .3s}
  .nav-links.open{transform:translateY(0);opacity:1;pointer-events:all}
  .hero-inner{grid-template-columns:1fr;text-align:center;gap:2.5rem}
  .hero-btns,.hero-socials{justify-content:center}
  .photo-ring{width:220px;height:220px}
  .form-row{grid-template-columns:1fr}
}
@media(max-width:480px){
  section{padding:60px 1rem}
  .hero{padding:80px 1rem 2rem}
  nav{padding:0 1rem}
}
</style>
</head>

/* ── THEME TOGGLE ── */
function toggleTheme(){
  const isDark = document.documentElement.getAttribute('data-theme')==='dark';
  document.documentElement.setAttribute('data-theme', isDark?'light':'dark');
  document.getElementById('themeBtn').innerHTML = isDark
    ? '<i class="fas fa-moon"></i>'
    : '<i class="fas fa-sun"></i>';
  try{localStorage.setItem('theme', isDark?'light':'dark')}catch(e){}
}
try{
  const saved = localStorage.getItem('theme')||'light';
  document.documentElement.setAttribute('data-theme',saved);
  document.getElementById('themeBtn').innerHTML = saved==='dark'
    ? '<i class="fas fa-sun"></i>'
    : '<i class="fas fa-moon"></i>';
}catch(e){}

/* ── MOBILE MENU ── */
function toggleMenu(){document.getElementById('navLinks').classList.toggle('open')}
function closeMenu(){document.getElementById('navLinks').classList.remove('open')}

/* ── SCROLL TOP BUTTON ── */
window.addEventListener('scroll',()=>{
  document.getElementById('scrollTop').classList.toggle('vis',window.scrollY>400);
});

/* ── SCROLL ANIMATIONS ── */
const obs = new IntersectionObserver(entries=>{
  entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('vis');obs.unobserve(e.target)}});
},{threshold:.1});
document.querySelectorAll('.fade').forEach(el=>obs.observe(el));

/* ── CONTACT FORM ── */
function sendForm(){
  const fn=document.getElementById('fn').value.trim();
  const fe=document.getElementById('fe').value.trim();
  const fm=document.getElementById('fm').value.trim();
  if(!fn||!fe||!fm){alert('Please fill in your name, email, and message.');return;}
  const ok=document.getElementById('formOk');
  ok.style.display='block';
  ['fn','ln','fe','fs','fm'].forEach(id=>document.getElementById(id).value='');
  setTimeout(()=>ok.style.display='none',6000);
}

/* ── RESUME DOWNLOAD ──
   Update DATA.resumeURL to your PDF path, e.g. './Bakhtiar_Safi_Resume.pdf' */
function dlResume(e){
  if(DATA.resumeURL==='#'){
    e.preventDefault();
    alert('📄 Add your resume PDF to the project folder and update DATA.resumeURL in the data section.');

}
